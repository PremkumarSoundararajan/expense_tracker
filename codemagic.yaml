# Workflows are manual: no push, tag, PR or schedule triggers consume minutes.
workflows:
  ios-compile-check:
    name: iOS unsigned compile check
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.47.8
      xcode: latest
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/org.swift.swiftpm
    scripts:
      - name: Resolve Flutter dependencies
        script: flutter pub get --enforce-lockfile
      - name: Configure Google sign-in when an iOS client is available
        script: |
          set -euo pipefail
          if [ -n "${GOOGLE_IOS_CLIENT_ID:-}" ]; then
            dart run tool/configure_ios.dart
          else
            echo 'Compile-only check: iOS Google OAuth is not configured; this artifact is not ready for device testing.'
          fi
      - name: Analyze Dart errors
        script: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings
      - name: Test sign-in and native entry points
        script: >-
          flutter test --no-pub
          test/google_sign_in_configuration_test.dart
          test/configure_ios_test.dart
          test/widget_test.dart
          test/google_drive_permission_service_test.dart
          test/statement_file_reader_test.dart
          test/daily_reminder_settings_dialog_test.dart
      - name: Build unsigned iOS app
        script: flutter build ios --release --no-codesign --no-pub
    artifacts:
      - build/ios/iphoneos/*.app
      - /tmp/xcodebuild_logs/*.log

  ios-testflight:
    name: iOS signed TestFlight build
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      # Create this named integration in Codemagic before selecting this workflow.
      app_store_connect: pocket-ledger-app-store
    environment:
      flutter: 3.47.8
      xcode: latest
      groups:
        # GOOGLE_IOS_CLIENT_ID and APP_STORE_APPLE_ID (see docs/ios-release.md).
        - pocket_ledger_ios
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.premkumar.pocketledger
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/org.swift.swiftpm
    scripts:
      - name: Check release configuration before building
        script: |
          set -euo pipefail
          : "${GOOGLE_IOS_CLIENT_ID:?Set the Google iOS OAuth client in pocket_ledger_ios}"
          : "${APP_STORE_APPLE_ID:?Set the numeric App Store Connect app ID in pocket_ledger_ios}"
          [[ "$APP_STORE_APPLE_ID" =~ ^[0-9]+$ ]] || { echo 'APP_STORE_APPLE_ID must be numeric'; exit 1; }
      - name: Resolve Flutter dependencies
        script: flutter pub get --enforce-lockfile
      - name: Configure native Google sign-in
        script: dart run tool/configure_ios.dart
      - name: Analyze Dart errors
        script: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings
      - name: Test sign-in and native entry points
        script: >-
          flutter test --no-pub
          test/google_sign_in_configuration_test.dart
          test/configure_ios_test.dart
          test/widget_test.dart
          test/google_drive_permission_service_test.dart
          test/statement_file_reader_test.dart
          test/daily_reminder_settings_dialog_test.dart
      - name: Apply Apple signing profiles
        script: xcode-project use-profiles
      - name: Build signed IPA with a new build number
        script: |
          set -euo pipefail
          latest=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID")
          latest=${latest:-0}
          [[ "$latest" =~ ^[0-9]+$ ]] || { echo 'Could not resolve a numeric TestFlight build number'; exit 1; }
          build_number=$((latest + 1))
          ci_number=$((${PROJECT_BUILD_NUMBER:-0} + 18))
          if (( ci_number > build_number )); then build_number=$ci_number; fi
          flutter build ipa --release --no-pub \
            --build-number="$build_number" \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive/dSYMs/*.dSYM
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Upload only. Choose internal testers and any external beta review in
        # App Store Connect after checking the build. Never auto-publish live.
        submit_to_testflight: false
        submit_to_app_store: false
